plugins {
    alias libs.plugins.neoforge.moddev
}

base {
    archivesName = "${mod_id}-neoforge"
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

neoForge {
    version = libs.versions.neoforge.get()

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def properties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_credits            : mod_credits,
            neoforge_loader_range  : neoforge_loader_range,
            minecraft_version_range: minecraft_version_range
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

jar {
    archiveFileName = "${mod_id}-neoforge-${project.version}.jar"
}
