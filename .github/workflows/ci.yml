name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader:
          - fabric
          - forge
          - neoforge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Build
        run: ./gradlew :${{ matrix.loader }}:build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mf3ff-${{ matrix.loader }}-${{ github.sha }}
          path: |
            ${{ matrix.loader }}/build/libs/mf3ff-${{ matrix.loader }}-*.jar
            !${{ matrix.loader }}/build/libs/*-dev.jar
            !${{ matrix.loader }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix result
        if: ${{ needs.build.result != 'success' }}
        run: exit 1
