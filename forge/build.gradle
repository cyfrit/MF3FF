plugins {
    alias libs.plugins.forge.gradle
}

base {
    archivesName = "${mod_id}-forge"
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${libs.versions.forge.get()}")
}

processResources {
    def properties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_credits            : mod_credits,
            forge_loader_range     : forge_loader_range,
            minecraft_version_range: minecraft_version_range
    ]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

jar {
    archiveFileName = "${mod_id}-forge-${project.version}.jar"
    manifest {
        attributes 'MixinConfigs': 'mf3ff.mixins.json'
    }
}
